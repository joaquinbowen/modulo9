<h1>Youtube</h1>

<p>{{web}}</p>

<a [href]="web" [class.activo]="redirigir" target="_blank">Ir a mi web</a>

@if(redirigir) {
<p>¡El enlace funciona correctamente!</p>
} @else {
<p>Lo sentimos, este enlace no está disponible.</p>
}

<button (click)="cambioRedireccion()">Modificar enlace</button>

<h2>Lista de Préstamos</h2>

@for(prestamo of prestamosList; track prestamo.id) {
<div [class.aprobado]="prestamo.estado === 'Aprobado'" [class.pendiente]="prestamo.estado === 'Pendiente'">
    <p><strong>ID:</strong> {{prestamo.id}}</p>
    <p><strong>Monto:</strong> ${{prestamo.monto}}</p>
    <p><strong>Estado:</strong> {{prestamo.estado}}</p>
</div>
}
